<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Мессенджер</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --bg:#0f0f0f;--surface:#1c1c1e;--surface2:#2c2c2e;--header:#1c1c1e;
            --accent:#007aff;--text:#fff;--text2:#8e8e93;--separator:#38383a;
            --msg-mine-bg:#007aff;--msg-other-bg:#2c2c2e;--msg-text:#fff;--msg-mine-text:#fff;
            --send-btn-text:'↑';--typing-text:'печатает...';--recording-text:'🎤';--new-chat-text:'Новая беседа';
        }
        .theme-light{--bg:#f2f2f7;--surface:#fff;--surface2:#e5e5ea;--header:#f9f9f9;--text:#000;--text2:#8e8e93;--separator:#c6c6c8;--msg-other-bg:#e5e5ea;--msg-text:#000;}
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;user-select:none;}
        #register-screen,#login-screen,#waiting-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px;gap:10px;background:var(--bg);overflow-y:auto;}
        #login-screen,#waiting-screen{display:none;}
        h1{font-size:26px;margin-bottom:16px;font-weight:700;}
        p{color:var(--text2);font-size:12px;text-align:center;}
        input{width:100%;max-width:300px;padding:12px 14px;border:none;border-radius:10px;background:var(--surface2);color:var(--text);font-size:14px;outline:none;}
        input::placeholder{color:var(--text2);}
        button{width:100%;max-width:300px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
        button:active{opacity:0.7;}
        .link-btn{background:none;color:var(--accent);font-size:13px;text-decoration:underline;padding:6px;width:auto;}
        .error{color:#ff3b30;font-size:12px;}
        .spinner{width:36px;height:36px;border:3px solid var(--surface2);border-top:3px solid var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}

        #app{display:none;height:100vh;flex-direction:column;}
        #header{display:flex;align-items:center;padding:8px 14px;background:var(--header);border-bottom:1px solid var(--separator);gap:10px;min-height:46px;}
        #header-title{font-weight:700;font-size:16px;flex:1;}
        #profile-btn,#settings-btn{font-size:20px;cursor:pointer;background:none;border:none;color:var(--accent);}
        #main-content{display:flex;flex:1;overflow:hidden;}
        #sidebar{width:280px;background:var(--surface);border-right:1px solid var(--separator);overflow-y:auto;flex-shrink:0;}
        #sidebar-header{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--separator);}
        #sidebar-header span{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;}
        #new-chat-btn{background:var(--accent);color:#fff;border:none;padding:5px 10px;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600;}
        #new-chat-btn::after{content:var(--new-chat-text);}
        .chat-item{display:flex;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--separator);gap:10px;}
        .chat-item:active{background:var(--surface2);}.chat-item.active{background:var(--accent);}
        .chat-avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;background-color:var(--accent);}
        .chat-info{flex:1;min-width:0;}.chat-name{font-weight:600;font-size:14px;}.chat-last-msg{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

        #chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg);}
        #chat-header{padding:10px 14px;background:var(--header);border-bottom:1px solid var(--separator);font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;min-height:42px;}
        #back-btn{display:none;font-size:18px;cursor:pointer;}
        #messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px;}
        .message{display:flex;align-items:flex-end;gap:8px;max-width:80%;animation:fadeIn 0.3s;}
        @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
        .message.mine{align-self:flex-end;flex-direction:row-reverse;}
        .msg-avatar{width:26px;height:26px;border-radius:50%;flex-shrink:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background-color:var(--accent);}
        .message-bubble{padding:8px 12px;border-radius:16px;font-size:14px;word-wrap:break-word;line-height:1.4;max-width:260px;}
        .message.mine .message-bubble{background:var(--msg-mine-bg);color:var(--msg-mine-text);border-bottom-right-radius:4px;}
        .message.other .message-bubble{background:var(--msg-other-bg);color:var(--msg-text);border-bottom-left-radius:4px;}
        .message-sender{font-size:10px;color:#5a9bd5;margin-bottom:2px;font-weight:600;}
        .message-time{font-size:10px;color:var(--text2);margin-top:2px;text-align:right;}
        .message img,.message video{max-width:200px;border-radius:8px;margin-top:4px;display:block;}
        .voice-msg{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--msg-mine-bg);border-radius:12px;cursor:pointer;min-width:150px;}
        .voice-msg.other{background:var(--msg-other-bg);}
        .voice-play{font-size:20px;}

        #typing-indicator{font-size:12px;color:var(--accent);padding:2px 16px;min-height:20px;}
        #input-area{display:none;padding:8px 10px;background:var(--header);border-top:1px solid var(--separator);gap:6px;align-items:center;}
        #attach-btn,#voice-btn{font-size:22px;cursor:pointer;background:none;border:none;color:var(--accent);}
        #msg-input{flex:1;min-width:200px;padding:8px 14px;border:1px solid var(--separator);border-radius:18px;background:var(--surface2);color:var(--text);font-size:14px;outline:none;}
        #send-btn{width:34px;height:34px;border:none;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        #send-btn::after{content:var(--send-btn-text);}

        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1000;justify-content:center;align-items:center;}
        .modal.active{display:flex;}
        .modal-content{background:var(--surface);padding:18px;border-radius:12px;width:90%;max-width:400px;max-height:85vh;overflow-y:auto;}
        .modal-content h3{margin-bottom:12px;font-size:17px;}
        .modal-content select,.modal-content input[type="text"],.modal-content input[type="file"],.modal-content input[type="color"],.modal-content textarea{width:100%;padding:10px;margin:5px 0;border-radius:8px;background:var(--surface2);color:var(--text);border:none;font-size:13px;}
        .modal-content textarea{resize:vertical;min-height:60px;}
        .modal-content label{font-size:12px;color:var(--text2);display:block;margin-top:6px;}
        .btn-primary{background:var(--accent);color:#fff;width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;margin-top:8px;}
        .btn-secondary{background:var(--surface2);color:var(--text);width:100%;padding:10px;border:none;border-radius:8px;cursor:pointer;font-size:14px;margin-top:4px;}
        #user-checklist label{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:13px;}
        #user-checklist input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);}

        .post-item{background:var(--surface2);padding:10px;border-radius:10px;margin:8px 0;}
        .post-item img,.post-item video{max-width:100%;border-radius:8px;margin-top:6px;}
        .post-time{font-size:10px;color:var(--text2);}

        @media(max-width:600px){
            #sidebar{width:100%;}#chat-area{display:none;}#chat-area.visible{display:flex;}#sidebar.hidden{display:none;}#back-btn{display:block;}
        }
    </style>
</head>
<body>

<!-- РЕГИСТРАЦИЯ -->
<div id="register-screen">
    <h1>💬 Регистрация</h1>
    <p>Все поля обязательны</p>
    <input type="text" id="reg-first" placeholder="Имя" maxlength="30">
    <input type="text" id="reg-last" placeholder="Фамилия" maxlength="30">
    <input type="tel" id="reg-phone" placeholder="Номер телефона">
    <input type="password" id="reg-pass1" placeholder="Пароль" maxlength="30">
    <input type="password" id="reg-pass2" placeholder="Повторите пароль" maxlength="30">
    <button onclick="apply()">Отправить заявку</button>
    <button class="link-btn" onclick="showLogin()">Уже есть аккаунт? Войти</button>
    <div class="error" id="reg-error"></div>
</div>

<!-- ВХОД -->
<div id="login-screen">
    <h1>🔑 Вход</h1>
    <input type="number" id="login-id" placeholder="Ваш ID">
    <input type="password" id="login-pass" placeholder="Пароль">
    <button onclick="login()">Войти</button>
    <button class="link-btn" onclick="showRegister()">Регистрация</button>
    <div class="error" id="login-error"></div>
</div>

<!-- ОЖИДАНИЕ -->
<div id="waiting-screen">
    <div class="spinner"></div>
    <p>Ожидайте одобрения...</p>
    <p style="color:var(--text2);">Ваш ID: <b id="pending-id-display"></b></p>
    <button class="link-btn" onclick="cancelApply()" style="color:#ff3b30;">Отменить заявку</button>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app">
    <div id="header">
        <span id="header-title">Чаты</span>
        <button id="profile-btn" onclick="openProfile()">👤</button>
        <button id="settings-btn" onclick="openSettings()">⚙️</button>
    </div>
    <div id="main-content">
        <div id="sidebar">
            <div id="sidebar-header"><span>Чаты</span><button id="new-chat-btn" onclick="openNewChat()"></button></div>
            <div id="chat-list"></div>
        </div>
        <div id="chat-area">
            <div id="chat-header"><span id="back-btn" onclick="goBack()">←</span><span id="chat-title">Выберите чат</span></div>
            <div id="messages"></div>
            <div id="typing-indicator"></div>
            <div id="input-area">
                <button id="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="file" id="file-input" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx" onchange="uploadFile()">
                <button id="voice-btn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
                <input type="text" id="msg-input" placeholder="Сообщение...">
                <button id="send-btn" onclick="sendMessage()"></button>
            </div>
        </div>
    </div>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h3>⚙️ Настройки</h3>
        <label>Тема:</label>
        <select id="theme-select" onchange="changeTheme(this.value)">
            <option value="dark">Тёмная</option>
            <option value="light">Светлая</option>
            <option value="custom">Кастомная</option>
        </select>
        <div id="custom-colors" style="display:none;">
            <label>Фон:</label><input type="color" id="c-bg" value="#0f0f0f">
            <label>Поверхности:</label><input type="color" id="c-surface" value="#1c1c1e">
            <label>Акцент:</label><input type="color" id="c-accent" value="#007aff">
            <label>Текст:</label><input type="color" id="c-text" value="#ffffff">
            <label>Мои сообщения:</label><input type="color" id="c-mymsg" value="#007aff">
            <label>Чужие сообщения:</label><input type="color" id="c-othermsg" value="#2c2c2e">
            <label>Текст сообщений:</label><input type="color" id="c-msgtext" value="#ffffff">
            <label>Кнопка отправки:</label><input type="text" id="c-sendtext" placeholder="↑">
            <label>Текст "печатает...":</label><input type="text" id="c-typing" placeholder="печатает...">
            <label>Текст записи:</label><input type="text" id="c-recording" placeholder="🎤">
            <label>Кнопка "Новая беседа":</label><input type="text" id="c-newchat" placeholder="Новая беседа">
        </div>
        <label>Обои чата (ссылка):</label>
        <input type="text" id="wallpaper-input" placeholder="https://...">
        <label>О себе:</label>
        <textarea id="bio-input" placeholder="Расскажите о себе..."></textarea>
        <label>Аватарка:</label>
        <input type="file" id="avatar-file" accept="image/*">
        <button class="btn-primary" onclick="saveAllSettings()">Сохранить всё</button>
        <button class="btn-secondary" onclick="closeSettings()">Закрыть</button>
    </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile-modal" class="modal">
    <div class="modal-content" id="profile-content"></div>
</div>

<!-- НОВЫЙ ЧАТ -->
<div id="new-chat-modal" class="modal">
    <div class="modal-content">
        <h3>💬 Новая беседа</h3>
        <input type="text" id="chat-name-input" placeholder="Название беседы">
        <p style="color:var(--text2);font-size:11px;margin:4px 0;">Выберите участников:</p>
        <div id="user-checklist"></div>
        <button class="btn-primary" onclick="createChat()">Создать</button>
        <button class="btn-secondary" onclick="closeNewChat()">Отмена</button>
    </div>
</div>

<script>
let currentUser=null,currentChat=null,ws=null,allUsers=[],myChats=[],pendingFile=null,currentTheme='dark';
let mediaRecorder=null,audioChunks=[],recordingTimer=null,recordingSeconds=0;

function showLogin(){document.getElementById('register-screen').style.display='none';document.getElementById('login-screen').style.display='flex';}
function showRegister(){document.getElementById('login-screen').style.display='none';document.getElementById('register-screen').style.display='flex';}

async function apply(){
    const f=document.getElementById('reg-first').value.trim(),
          l=document.getElementById('reg-last').value.trim(),
          ph=document.getElementById('reg-phone').value.trim(),
          p1=document.getElementById('reg-pass1').value,
          p2=document.getElementById('reg-pass2').value;
    if(!f||!l||!ph||!p1||!p2){document.getElementById('reg-error').textContent='Заполните все поля';return;}
    if(p1!==p2){document.getElementById('reg-error').textContent='Пароли не совпадают';return;}
    try{
        const r=await fetch('/api/apply',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({first_name:f,last_name:l,password:p1,phone:ph})
        });
        if(!r.ok){document.getElementById('reg-error').textContent='Ошибка сервера';return;}
        const d=await r.json();
        localStorage.setItem('pending_id',d.user_id);
        document.getElementById('pending-id-display').textContent=d.user_id;
        document.getElementById('register-screen').style.display='none';
        document.getElementById('waiting-screen').style.display='flex';
        checkStatus();
        setInterval(checkStatus,3000);
    }catch(e){document.getElementById('reg-error').textContent='Ошибка соединения';}
}

async function checkStatus(){
    const id=localStorage.getItem('pending_id');if(!id)return;
    const r=await fetch(`/api/check_status/${id}`);const d=await r.json();
    if(d.status==='approved'&&d.user){currentUser=d.user;saveAndEnter();}
    else if(d.status==='rejected'){document.getElementById('waiting-screen').innerHTML='<p>❌ Отклонено</p>';}
}

async function login(){
    const id=document.getElementById('login-id').value.trim(),p=document.getElementById('login-pass').value;
    if(!id||!p){document.getElementById('login-error').textContent='Заполните все поля';return;}
    try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:parseInt(id),password:p})});
        if(!r.ok){const e=await r.json();document.getElementById('login-error').textContent=e.detail;return;}
        const d=await r.json();currentUser=d.user;saveAndEnter();
    }catch(e){document.getElementById('login-error').textContent='Ошибка входа';}
}

function saveAndEnter(){
    localStorage.setItem('user',JSON.stringify(currentUser));
    document.getElementById('register-screen').style.display='none';document.getElementById('login-screen').style.display='none';
    document.getElementById('waiting-screen').style.display='none';document.getElementById('app').style.display='flex';
    loadApp();
}

async function loadApp(){await loadUsers();await loadChats();connectWS();loadThemeFromUser();}
async function loadUsers(){const r=await fetch('/api/users');allUsers=(await r.json()).users;}
async function loadChats(){if(!currentUser)return;const r=await fetch(`/api/my_chats/${currentUser.id}`);myChats=(await r.json()).chats;renderChats();}
function renderChats(){document.getElementById('chat-list').innerHTML=myChats.map(c=>`<div class="chat-item" onclick="openChat('${c.id}','${c.name}')"><div class="chat-avatar">${c.name[0].toUpperCase()}</div><div class="chat-info"><div class="chat-name">${c.name}</div><div class="chat-last-msg" id="last-${c.id}"></div></div></div>`).join('');}

function connectWS(){
    if(!currentUser)return;
    const p=location.protocol==='https:'?'wss':'ws';
    ws=new WebSocket(`${p}://${location.host}/ws/${currentUser.id}`);
    ws.onmessage=e=>{
        const d=JSON.parse(e.data);
        if(d.type==='new_message'&&d.chat_id===currentChat){addMsg(d);updateLast(d);}
        if(d.type==='typing'){document.getElementById('typing-indicator').textContent=d.is_typing?`${d.user} ${getComputedStyle(document.documentElement).getPropertyValue('--typing-text').replace(/"/g,'')}`:'';}
    };
    ws.onclose=()=>setTimeout(connectWS,3000);
}

async function openChat(cid,cname){
    currentChat=cid;document.getElementById('chat-title').textContent=cname;
    document.getElementById('input-area').style.display='flex';document.getElementById('messages').innerHTML='';
    const r=await fetch(`/api/messages/${cid}`);(await r.json()).messages.forEach(m=>addMsg(m));
    document.querySelectorAll('.chat-item').forEach((el,i)=>el.classList.toggle('active',myChats[i]?.id===cid));
    if(window.innerWidth<=600){document.getElementById('sidebar').classList.add('hidden');document.getElementById('chat-area').classList.add('visible');}
    setTimeout(()=>{document.getElementById('messages').scrollTop=99999},100);
}
function goBack(){document.getElementById('sidebar').classList.remove('hidden');document.getElementById('chat-area').classList.remove('visible');}

function addMsg(msg){
    const div=document.createElement('div');div.className=`message ${msg.sender_id===currentUser?.id?'mine':'other'}`;
    const t=msg.timestamp?new Date(msg.timestamp).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
    let content='';
    if(msg.file_type==='voice'){
        content=`<div class="voice-msg ${msg.sender_id!==currentUser?.id?'other':''}" onclick="this.querySelector('audio').play()"><span class="voice-play">▶</span><audio src="${msg.file_url}" preload="metadata"></audio><span>Голосовое</span></div>`;
    }else{
        if(msg.file_url){
            if(msg.file_type==='image'||msg.file_type==='video'){
                if(msg.file_type==='image')content+=`<img src="${msg.file_url}" loading="lazy">`;
                else content+=`<video src="${msg.file_url}" controls preload="metadata" style="width:200px;height:200px;object-fit:cover;"></video>`;
            }else content+=`<a href="${msg.file_url}" target="_blank">📎 Файл</a>`;
        }
        if(msg.text)content+=`<div>${esc(msg.text)}</div>`;
    }
    div.innerHTML=`<div class="msg-avatar">${(msg.sender_name||'?')[0].toUpperCase()}</div><div>${msg.sender_id!==currentUser?.id?`<div class="message-sender">${msg.sender_name}</div>`:''}<div class="message-bubble">${content}</div><div class="message-time">${t}</div></div>`;
    document.getElementById('messages').appendChild(div);document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
}
function updateLast(msg){const el=document.getElementById(`last-${msg.chat_id}`);if(el)el.textContent=(msg.sender_id===currentUser?.id?'Вы: ':'')+(msg.text||(msg.file_type==='voice'?'🎤 Голосовое':'[Файл]')).substring(0,20);}

function sendMessage(){
    const input=document.getElementById('msg-input'),text=input.value.trim();
    if((!text&&!pendingFile)||!ws||!currentChat)return;
    ws.send(JSON.stringify({type:'message',chat_id:currentChat,sender_name:`${currentUser.first_name} ${currentUser.last_name}`,text:text,file_url:pendingFile?.url||null,file_type:pendingFile?.type||null}));
    input.value='';pendingFile=null;document.getElementById('file-input').value='';
}
async function uploadFile(){
    const file=document.getElementById('file-input').files[0];if(!file)return;
    const fd=new FormData();fd.append('file',file);
    pendingFile=await(await fetch('/api/upload',{method:'POST',body:fd})).json();
    document.getElementById('msg-input').placeholder='Файл прикреплён...';
}

async function startRecording(){
    if(!navigator.mediaDevices){alert('Микрофон не поддерживается');return;}
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder=new MediaRecorder(stream);audioChunks=[];
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=async()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        const fd=new FormData();fd.append('file',blob,'voice.webm');
        const r=await fetch('/api/upload_voice',{method:'POST',body:fd});
        pendingFile=await r.json();pendingFile.type='voice';
        document.getElementById('msg-input').placeholder='Голосовое готово. Нажмите отправить';
    };
    mediaRecorder.start();recordingSeconds=0;
    document.getElementById('voice-btn').textContent='0:00';document.getElementById('voice-btn').style.color='#ff3b30';
    recordingTimer=setInterval(()=>{recordingSeconds++;const m=Math.floor(recordingSeconds/60),s=recordingSeconds%60;document.getElementById('voice-btn').textContent=`${m}:${s.toString().padStart(2,'0')}`;},1000);
}
function stopRecording(){
    if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();
    clearInterval(recordingTimer);document.getElementById('voice-btn').textContent='🎤';document.getElementById('voice-btn').style.color='var(--accent)';
}

document.getElementById('msg-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});
document.getElementById('msg-input').addEventListener('input',()=>{if(ws&&currentChat)ws.send(JSON.stringify({type:'typing',chat_id:currentChat,is_typing:true}));clearTimeout(window.typingTimer);window.typingTimer=setTimeout(()=>{if(ws&&currentChat)ws.send(JSON.stringify({type:'typing',chat_id:currentChat,is_typing:false}));},2000);});

function openSettings(){
    document.getElementById('settings-modal').classList.add('active');document.getElementById('theme-select').value=currentTheme;
    document.getElementById('custom-colors').style.display=currentTheme==='custom'?'block':'none';
    if(currentUser){document.getElementById('bio-input').value=currentUser.bio||'';}
}
function closeSettings(){document.getElementById('settings-modal').classList.remove('active');}
function changeTheme(v){document.getElementById('custom-colors').style.display=v==='custom'?'block':'none';}
async function saveAllSettings(){
    const theme=document.getElementById('theme-select').value,wallpaper=document.getElementById('wallpaper-input').value.trim();
    const bio=document.getElementById('bio-input').value.trim();
    const avatarFile=document.getElementById('avatar-file').files[0];
    if(avatarFile&&currentUser){const fd=new FormData();fd.append('file',avatarFile);await fetch(`/api/upload_avatar/${currentUser.id}`,{method:'POST',body:fd});}
    let customTheme=null;
    if(theme==='custom'){customTheme=JSON.stringify({bg:document.getElementById('c-bg').value,surface:document.getElementById('c-surface').value,accent:document.getElementById('c-accent').value,text:document.getElementById('c-text').value,mymsg:document.getElementById('c-mymsg').value,othermsg:document.getElementById('c-othermsg').value,msgtext:document.getElementById('c-msgtext').value,sendtext:document.getElementById('c-sendtext').value,typing:document.getElementById('c-typing').value,recording:document.getElementById('c-recording').value,newchat:document.getElementById('c-newchat').value});}
    await fetch(`/api/update_profile/${currentUser.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({theme,wallpaper_url:wallpaper||'',custom_theme:customTheme,bio:bio||''})});
    if(currentUser){currentUser.bio=bio;}
    applyTheme(theme,customTheme,wallpaper);closeSettings();loadUsers();
}
function applyTheme(theme,customThemeJson,wallpaper){
    currentTheme=theme;document.body.className='';if(theme==='light')document.body.classList.add('theme-light');
    if(theme==='custom'&&customThemeJson){const c=JSON.parse(customThemeJson);['bg','surface','accent','text','mymsg','othermsg','msgtext'].forEach(k=>document.documentElement.style.setProperty(`--${k==='bg'?'bg':k==='surface'?'surface':k==='accent'?'accent':k==='text'?'text':k==='mymsg'?'msg-mine-bg':k==='othermsg'?'msg-other-bg':'msg-text'}`,c[k]));if(c.sendtext)document.documentElement.style.setProperty('--send-btn-text',`'${c.sendtext}'`);if(c.typing)document.documentElement.style.setProperty('--typing-text',c.typing);if(c.recording)document.documentElement.style.setProperty('--recording-text',c.recording);if(c.newchat)document.documentElement.style.setProperty('--new-chat-text',`'${c.newchat}'`);}
    if(wallpaper&&document.getElementById('chat-area')){document.getElementById('chat-area').style.backgroundImage=`url(${wallpaper})`;document.getElementById('chat-area').style.backgroundSize='cover';}
    localStorage.setItem('theme',theme);if(customThemeJson)localStorage.setItem('customTheme',customThemeJson);localStorage.setItem('wallpaper',wallpaper||'');
}
function loadThemeFromUser(){if(!currentUser)return;applyTheme(currentUser.theme||'dark',currentUser.custom_theme,currentUser.wallpaper_url);}

// Профиль
async function openProfile(){
    if(!currentUser)return;
    const r=await fetch(`/api/posts/${currentUser.id}`);const posts=(await r.json()).posts;
    document.getElementById('profile-content').innerHTML=`
        <h3>👤 ${currentUser.first_name} ${currentUser.last_name}</h3>
        <p style="color:var(--text2);">📱 ${currentUser.phone||'—'}</p>
        <p>${currentUser.bio||''}</p>
        <h4 style="margin-top:12px;">Новый статус</h4>
        <textarea id="post-text" placeholder="Что нового?"></textarea>
        <input type="file" id="post-file" accept="image/*,video/*">
        <button class="btn-primary" onclick="createPost()">Опубликовать</button>
        <h4 style="margin-top:12px;">Мои статусы</h4>
        ${posts.map(p=>`<div class="post-item">${p.text?`<p>${p.text}</p>`:''}${p.file_url?(p.file_type==='image'?`<img src="${p.file_url}">`:`<video src="${p.file_url}" controls></video>`):''}<div class="post-time">${new Date(p.timestamp).toLocaleString('ru-RU')}</div></div>`).join('')}
        <button class="btn-secondary" onclick="closeProfile()">Закрыть</button>
    `;
    document.getElementById('profile-modal').classList.add('active');
}
function closeProfile(){document.getElementById('profile-modal').classList.remove('active');}
async function createPost(){
    const text=document.getElementById('post-text')?.value.trim()||'';
    const file=document.getElementById('post-file')?.files[0];
    let fileUrl=null,fileType=null;
    if(file){const fd=new FormData();fd.append('file',file);const r=await fetch('/api/upload',{method:'POST',body:fd});const d=await r.json();fileUrl=d.url;fileType=d.type;}
    await fetch(`/api/create_post/${currentUser.id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,file_url:fileUrl,file_type:fileType})});
    openProfile();
}

async function openNewChat(){document.getElementById('new-chat-modal').classList.add('active');document.getElementById('user-checklist').innerHTML=allUsers.filter(u=>u.id!==currentUser?.id).map(u=>`<label><input type="checkbox" value="${u.id}"> ${u.first_name} ${u.last_name}</label>`).join('');}
function closeNewChat(){document.getElementById('new-chat-modal').classList.remove('active');}
async function createChat(){const name=document.getElementById('chat-name-input').value.trim()||'Новая беседа';const ids=[currentUser.id,...Array.from(document.querySelectorAll('#user-checklist input:checked')).map(c=>+c.value)];if(ids.length<2)return;const r=await fetch('/api/create_chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,user_ids:ids})});const d=await r.json();closeNewChat();await loadChats();openChat(d.chat_id,d.name);}

function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
async function cancelApply() {
    const id = localStorage.getItem('pending_id');
    if (id) {
        await fetch(`/api/reject/${id}`, { method: 'POST' });
    }
    localStorage.clear();
    document.getElementById('waiting-screen').style.display = 'none';
    document.getElementById('register-screen').style.display = 'flex';
}
window.onload=()=>{
    const saved=localStorage.getItem('user');
    if(saved){currentUser=JSON.parse(saved);document.getElementById('register-screen').style.display='none';document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='flex';loadApp();return;}
    const pid=localStorage.getItem('pending_id');
    if(pid){document.getElementById('register-screen').style.display='none';document.getElementById('waiting-screen').style.display='flex';document.getElementById('pending-id-display').textContent=pid;checkStatus();setInterval(checkStatus,3000);}
};
</script>
